<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="bannerTitle bannerDesc">
  <title id="bannerTitle">Fluxion</title>
  <desc id="bannerDesc">Fluxion — turn a fresh Linux machine into your machine. A YAML-driven Linux workstation bootstrapper, installed with a single curl command.</desc>

  <defs>
    <linearGradient id="fxBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1218"/>
      <stop offset="0.55" stop-color="#101c24"/>
      <stop offset="1" stop-color="#142d31"/>
    </linearGradient>

    <linearGradient id="fxMark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#47d6b6"/>
      <stop offset="1" stop-color="#7aa8ff"/>
    </linearGradient>

    <!-- userSpaceOnUse: a horizontal rule has a zero-height bounding box, which
         makes the default objectBoundingBox gradient degenerate and invisible. -->
    <linearGradient id="fxRule" gradientUnits="userSpaceOnUse" x1="74" y1="0" x2="430" y2="0">
      <stop offset="0" stop-color="#47d6b6" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#7aa8ff" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#f4c95d" stop-opacity="0"/>
    </linearGradient>

    <!-- Faint engineering grid, faded out toward the edges so it never competes
         with the wordmark or the terminal panel. -->
    <pattern id="fxGrid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0 H0 V44" fill="none" stroke="#1e2d3a" stroke-width="1"/>
    </pattern>

    <radialGradient id="fxGridFade" cx="0.42" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <mask id="fxGridMask">
      <rect width="1200" height="340" fill="url(#fxGridFade)"/>
    </mask>

    <filter id="fxGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="60"/>
    </filter>

    <clipPath id="fxClip">
      <rect width="1200" height="340" rx="26"/>
    </clipPath>
  </defs>

  <g clip-path="url(#fxClip)">
    <!-- rx is repeated here so the rounded corners survive even if a sanitiser
         strips the clip path. -->
    <rect width="1200" height="340" rx="26" fill="url(#fxBg)"/>

    <!-- ambient light -->
    <circle cx="215" cy="70" r="150" fill="#47d6b6" opacity="0.20" filter="url(#fxGlow)"/>
    <circle cx="900" cy="300" r="165" fill="#7aa8ff" opacity="0.16" filter="url(#fxGlow)"/>

    <rect width="1200" height="340" fill="url(#fxGrid)" mask="url(#fxGridMask)"/>

    <!-- ── brand ───────────────────────────────────────────────────────── -->
    <g transform="translate(72 56)">
      <rect width="62" height="62" rx="17" fill="url(#fxMark)"/>
      <path d="M35 11 L17 36 H28 L25 51 L44 26 H33 Z" fill="#06121a"/>
    </g>

    <text x="152" y="106" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif"
          font-size="70" font-weight="800" letter-spacing="-2.2" fill="#ffffff">fluxion</text>

    <path d="M74 140 H430" stroke="url(#fxRule)" stroke-width="3" stroke-linecap="round"/>

    <text x="74" y="180" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif"
          font-size="25" font-weight="600" fill="#d6fff4">Turn a fresh Linux machine into your machine.</text>

    <text x="74" y="212" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif"
          font-size="18" font-weight="400" fill="#93a7b4">One YAML profile. One preview. One run. CLI or TUI.</text>

    <!-- ── terminal panel ──────────────────────────────────────────────── -->
    <g transform="translate(742 52)">
      <rect width="386" height="186" rx="13" fill="#0b1218" fill-opacity="0.82"
            stroke="#ffffff" stroke-opacity="0.14"/>
      <path d="M0 34 H386" stroke="#ffffff" stroke-opacity="0.10" stroke-width="1"/>
      <circle cx="20" cy="17" r="4.5" fill="#47d6b6"/>
      <circle cx="36" cy="17" r="4.5" fill="#f4c95d"/>
      <circle cx="52" cy="17" r="4.5" fill="#ffffff" fill-opacity="0.22"/>
      <text x="70" y="22" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, monospace"
            font-size="12" fill="#6b8090">workstation.yaml</text>

      <!-- Columns are positioned with absolute tspan x values. Padding with
           spaces does not survive: SVG collapses whitespace unless xml:space
           is preserved, so the columns would not line up. -->
      <g font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, monospace" font-size="14">
        <text x="22" y="62" fill="#47d6b6">$ fluxion dry-run</text>
        <text x="22" y="90" fill="#6b8090">plan my-laptop · 2 jobs · 4 steps</text>

        <text y="120">
          <tspan x="22" fill="#47d6b6">+</tspan>
          <tspan x="42" fill="#e8f1f5">package</tspan>
          <tspan x="136" fill="#e8f1f5">cli-tools</tspan>
        </text>
        <text y="144">
          <tspan x="22" fill="#f4c95d">·</tspan>
          <tspan x="42" fill="#6b8090">binary</tspan>
          <tspan x="136" fill="#6b8090">kubectl</tspan>
          <tspan x="220" fill="#6b8090">skipped</tspan>
        </text>
        <text y="168">
          <tspan x="22" fill="#47d6b6">+</tspan>
          <tspan x="42" fill="#e8f1f5">flatpak</tspan>
          <tspan x="136" fill="#e8f1f5">apps</tspan>
        </text>
      </g>
    </g>

    <!-- ── install strip ───────────────────────────────────────────────── -->
    <path d="M72 264 H1128" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>

    <text x="72" y="300" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, monospace" font-size="14.5">
      <tspan fill="#47d6b6">$</tspan><tspan fill="#93a7b4" dx="10">curl --proto '=https' --tlsv1.2 --proto-redir '=https' -sSfL https://worxbend.github.io/fluxion/install.sh | sh</tspan>
    </text>

    <rect x="0.5" y="0.5" width="1199" height="339" rx="26" fill="none"
          stroke="#ffffff" stroke-opacity="0.10"/>
  </g>
</svg>
