            - Inconsolata
            - Hermit
            - CommitMono
            - Agave
            - GeistMono
            - Monaspace
            - ShareTechMono
            - Recursive
            - D2Coding
            - EnvyCodeR
            - IosevkaTerm
            - Lekton
            - Lilex
            - VictorMono
        probeCommand: "fc-list | grep -qi 'JetBrainsMono Nerd'"

  - name: flatpaks
    description: "Install Flatpak applications from scripts/flatpak.sh"
    dependsOn:
      - cli-and-dev-packages
    restartPolicy:
      type: none
    continueOnModuleError: true
    steps:
      - type: flatpak-remote
        name: flathub-remote
        remote: flathub
        url: https://flathub.org/repo/flathub.flatpakrepo
        checksum:
          algorithm: sha256
          value: 3371dd250e61d9e1633630073fefda153cd4426f72f4afa0c3373ae2e8fea03a

      - type: flatpak
        name: desktop-flatpaks
