name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version or tag, for example v1.2.3"
        required: true
        type: string
      prerelease:
        description: "Mark the GitHub release as a prerelease"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  policy:
    name: Verify Release Policy
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Check CI and native-image policy
        run: |
          python3 scripts/test_ci_policy.py
          python3 scripts/check_ci_policy.py
          python3 scripts/check-native-metadata.py

  known-tool-bytes:
    name: Verify Trusted Tool Bytes
    needs: policy
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Java 25
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Compare catalog digests with release bytes
        working-directory: sysboot
        env:
          SYSBOOT_VERIFY_KNOWN_TOOL_BYTES: "true"
        run: ./mill integration-tests.test.testOnly dev.sysboot.integration.KnownToolReleaseIT

  build:
    name: Build Release Assets
    needs: [policy, known-tool-bytes]
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      commit: ${{ steps.commit.outputs.commit }}
    steps:
      - name: Resolve release version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -eu
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            version="$INPUT_VERSION"
          else
            version="$REF_NAME"
          fi
          case "$version" in
            v*) ;;
            *) version="v${version}" ;;
          esac
          if ! printf '%s\n' "$version" |
            grep -Eq '^v[0-9A-Za-z][0-9A-Za-z._+-]*$'; then
            echo "Invalid release version: ${version}" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Resolve release commit
        id: commit
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up GraalVM Java 25
        uses: graalvm/setup-graalvm@0def53c0fd8534bc13416c9469f5be45265824fd # v1
        with:
          distribution: graalvm
          java-version: "25"
          github-token: ${{ secrets.GITHUB_TOKEN }}
          native-image-job-reports: true

      - name: Check release version metadata
        env:
          EXPECTED_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -eu
          expected="$EXPECTED_VERSION"
          actual="v$(sed -n 's/.*CURRENT = "\([^"]*\)".*/\1/p' sysboot/core/src/dev/sysboot/core/FluxionVersion.java)"
          if [ "$actual" != "$expected" ]; then
            echo "Version metadata mismatch: expected ${expected}, found ${actual}" >&2
            exit 1
          fi

      - name: Check native-image metadata
        run: python3 scripts/check-native-metadata.py

      - name: Run Java static analysis
        run: ./scripts/run-java-quality.sh

      - name: Run tests
        working-directory: sysboot
        run: ./mill __.test

      - name: Validate example configs
        working-directory: sysboot
        run: |
          set -u
          # Run the CLI with java rather than `mill cli.run`; see ci.yml.
          cli_cp="$(./mill show cli.runClasspath | sed -n 's#.*:\(/[^"[:space:]]*\)".*#\1#p' | paste -sd: -)"
          test -n "$cli_cp"
          for f in config/*.yaml; do
            rc=0
            java -cp "$cli_cp" dev.sysboot.cli.Main validate --no-tui -c "$f" || rc=$?
            if [ "$rc" -ne 0 ]; then
              echo "::error file=sysboot/${f}::validate exited ${rc}"
              exit "$rc"
            fi
          done

      - name: Build JVM assembly
        working-directory: sysboot
        run: ./mill cli.assembly

      - name: Smoke test JVM assembly
        env:
          EXPECTED_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -eu
          expected="${EXPECTED_VERSION#v}"
          test "$(java -jar sysboot/out/cli/assembly.dest/out.jar --version)" = "fluxion ${expected}"
          for f in sysboot/config/*.yaml; do
            java -jar sysboot/out/cli/assembly.dest/out.jar validate --no-tui -c "$f"
          done

      - name: Build native image
        working-directory: sysboot
        run: ./mill cli.nativeImage

      - name: Smoke test native image
        env:
          EXPECTED_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -eu
          executable=sysboot/out/cli/nativeImage.dest/native-executable
          generated="${RUNNER_TEMP}/fluxion-native-smoke.yaml"
          "$executable" --help >/dev/null
          expected="$EXPECTED_VERSION"
          expected="${expected#v}"
          test "$("$executable" --version)" = "fluxion ${expected}"
          for f in sysboot/config/*.yaml; do
            "$executable" validate --no-tui -c "$f"
          done
          "$executable" generate --os debian --profile smoke --output "$generated"
          "$executable" validate --no-tui -c "$generated"
          "$executable" doctor --skip-network -c "$generated"

      - name: Package release assets
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -eu
          version="$RELEASE_VERSION"
          mkdir -p dist/pkg
          cp sysboot/out/cli/assembly.dest/out.jar "dist/fluxion-${version}-all.jar"
          cp sysboot/out/cli/nativeImage.dest/native-executable dist/pkg/fluxion
          chmod +x dist/pkg/fluxion
          cp README.md dist/pkg/README.md
          mkdir -p dist/pkg/docs dist/pkg/config
          cp -R sysboot/docs/. dist/pkg/docs/
          cp -R sysboot/config/. dist/pkg/config/
          [ ! -f LICENSE ] || cp LICENSE dist/pkg/LICENSE
          source_date_epoch="$(git log -1 --format=%ct)"
          tar --sort=name --mtime="@${source_date_epoch}" --owner=0 --group=0 \
            --numeric-owner -C dist/pkg -cf - . |
            gzip -n > "dist/fluxion-${version}-linux-amd64.tar.gz"
          # Ship the installer as a release asset too. The name is deliberately
          # unversioned so releases/latest/download/install.sh is a stable URL.
          cp install.sh dist/install.sh
          chmod 644 dist/install.sh
          (cd dist && sha256sum "fluxion-${version}-all.jar" "fluxion-${version}-linux-amd64.tar.gz" install.sh > "fluxion-${version}-checksums.sha256")

      - name: Upload release assets as workflow artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fluxion-release-${{ steps.version.outputs.version }}
          path: |
            dist/*.jar
            dist/*.tar.gz
            dist/*.sha256
            dist/install.sh
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Checkout release ref
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Download release assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: fluxion-release-${{ needs.build.outputs.version }}
          path: dist

      - name: Ensure release tag exists
        env:
          RELEASE_COMMIT: ${{ needs.build.outputs.commit }}
          RELEASE_TAG: ${{ needs.build.outputs.version }}
        run: |
          set -eu
          tag="$RELEASE_TAG"
          requested_commit="$RELEASE_COMMIT"
          if git ls-remote --exit-code --refs origin "refs/tags/${tag}" >/dev/null 2>&1; then
            git fetch --force origin "refs/tags/${tag}:refs/tags/${tag}"
            tagged_commit="$(git rev-parse "refs/tags/${tag}^{commit}")"
            if [ "$tagged_commit" != "$requested_commit" ]; then
              echo "Tag ${tag} resolves to ${tagged_commit}, not ${requested_commit}" >&2
              exit 1
            fi
            echo "Tag ${tag} already resolves to the release commit"
          else
            git tag "${tag}" "$requested_commit"
            git push origin "refs/tags/${tag}"
          fi

      - name: Publish GitHub release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ needs.build.outputs.version }}
          name: fluxion ${{ needs.build.outputs.version }}
          target_commitish: ${{ needs.build.outputs.commit }}
          generate_release_notes: true
          prerelease: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease || false }}
          files: |
            dist/*.jar
            dist/*.tar.gz
            dist/*.sha256
            dist/install.sh
