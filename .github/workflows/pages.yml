name: Pages

on:
  push:
    branches:
      - master
    paths:
      - "site/**"
      - "install.sh"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

# Pages allows a single concurrent deployment. Queue rather than cancel so a
# push that only changes install.sh cannot drop an in-flight site deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and Deploy Site
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Assemble site
        run: |
          set -eu
          rm -rf _site
          mkdir -p _site
          cp -R site/. _site/
          # install.sh is served from the site root so the documented curl URL
          # always resolves to the script on master, independent of any release.
          cp install.sh _site/install.sh
          chmod 644 _site/install.sh
          touch _site/.nojekyll

      - name: Verify the published installer is the repository installer
        run: |
          set -eu
          a="$(sha256sum install.sh | cut -d' ' -f1)"
          b="$(sha256sum _site/install.sh | cut -d' ' -f1)"
          if [ "$a" != "$b" ]; then
            echo "Published installer does not match install.sh" >&2
            exit 1
          fi
          sh -n _site/install.sh

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
